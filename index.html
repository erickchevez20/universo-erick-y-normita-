<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050d"><title>El universo de Normita 🌻</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050d;color:#fff;font-family:Georgia,serif}canvas{position:fixed;inset:0;width:100%;height:100%}.veil{position:fixed;inset:0;background:radial-gradient(circle,transparent 25%,rgba(0,0,0,.7));pointer-events:none}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:3;transition:opacity 1s}.card{max-width:720px}.small{letter-spacing:4px;text-transform:uppercase;color:#f6d44f;font-size:14px;margin-bottom:16px}h1{font-size:clamp(48px,13vw,96px);margin:0 0 18px;text-shadow:0 0 28px #d8ad2a}p{font-size:clamp(19px,5vw,29px);line-height:1.5;color:#f8f5e9}button{border:1px solid #f3d04b;background:#f3d04b18;color:#fff;border-radius:30px;padding:14px 26px;font-size:17px;margin-top:20px;backdrop-filter:blur(8px)}#message{display:none}.flower{position:fixed;z-index:2;pointer-events:none;animation:float linear forwards;filter:drop-shadow(0 0 9px #ffd83d)}@keyframes float{0%{transform:translateY(110vh) rotate(0) scale(.5);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-15vh) rotate(360deg) scale(1.15);opacity:0}}.petal{position:fixed;z-index:5;pointer-events:none;animation:burst 1.4s forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(500deg);opacity:0}}.sign{color:#f5d451;letter-spacing:2px;font-size:18px}</style></head><body><canvas id="sky"></canvas><div class="veil"></div><section class="screen" id="intro"><div class="card"><div class="small">Una sorpresa para ti</div><h1>Normita 🌻</h1><p>Hay un pequeño universo que preparé solo para ti…</p><button id="open">Entrar al universo ✨</button></div></section><section class="screen" id="message"><div class="card"><div class="small">El universo de Normita</div><h1>🌻</h1><div id="phrase"></div><div class="sign">Con amor, Erick ❤️</div></div></section><script>const c=document.getElementById('sky'),x=c.getContext('2d');let s=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);s=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.2,a:Math.random()}))}addEventListener('resize',size);size();function stars(){x.clearRect(0,0,innerWidth,innerHeight);s.forEach(q=>{q.a+=.015;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fillStyle='rgba(255,235,150,'+(.3+Math.abs(Math.sin(q.a))*.7)+')';x.fill()});requestAnimationFrame(stars)}stars();const phrases=['Normita, entre millones de estrellas y flores, yo siempre encontraría el camino hacia ti. 🌻','Hoy te regalo flores amarillas, pero lo que de verdad quiero regalarte son muchos momentos a tu lado. 💛','Si pudiera convertir todo lo que siento en flores, este universo todavía se quedaría pequeño. 🌼','Gracias por ser esa persona que hace que mis días tengan un poquito más de color. ✨','Normita, nunca olvides lo especial que eres para mí. ❤️','Hoy el universo está lleno de flores amarillas… pero mi flor favorita siempre tendrá tu nombre. 🌻'];let i=0;function phrase(){document.getElementById('phrase').innerHTML='<p>'+phrases[i++%phrases.length]+'</p>'}function flower(){let f=document.createElement('div');f.className='flower';f.textContent=['🌻','🌼','💛'][Math.floor(Math.random()*3)];f.style.left=Math.random()*100+'vw';f.style.fontSize=18+Math.random()*25+'px';f.style.animationDuration=7+Math.random()*8+'s';document.body.appendChild(f);setTimeout(()=>f.remove(),16000)}setInterval(flower,650);document.getElementById('open').onclick=()=>{document.getElementById('intro').style.opacity=0;setTimeout(()=>{document.getElementById('intro').style.display='none';document.getElementById('message').style.display='flex';phrase()},900)};setInterval(()=>{if(document.getElementById('message').style.display==='flex')phrase()},6500);addEventListener('click',e=>{if(document.getElementById('message').style.display!=='flex')return;for(let n=0;n<12;n++){let p=document.createElement('div');p.className='petal';p.textContent='🌻';p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';let a=Math.random()*7,d=60+Math.random()*180;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),1500)}});</script></body></html>
